name: Build Unified Debian Packages

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  DEB_PACKAGE_NAME: sendspin-client
  DEB_VERSION: 0.1.0

jobs:
  build-debian-packages:
    name: Build Debian Package (${{ matrix.arch }} - ${{ matrix.debian }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 builds using GitHub Ubuntu runners
          - arch: amd64
            debian: trixie
            runner: ubuntu-latest
            image: "debian:trixie"
            use_container: true

          # ARM64 builds using standard Debian images
          - arch: arm64
            debian: bullseye
            runner: self-hosted
            image: "debian:bullseye"
            use_container: true
          - arch: arm64
            debian: bookworm
            runner: self-hosted
            image: "debian:bookworm"
            use_container: true
          - arch: arm64
            debian: trixie
            runner: self-hosted
            image: "debian:trixie"
            use_container: true

          # ARMHF builds using arm32v7 images
          - arch: armhf
            debian: bullseye
            runner: self-hosted
            image: "arm32v7/debian:bullseye"
            use_container: true
          - arch: armhf
            debian: bookworm
            runner: self-hosted
            image: "arm32v7/debian:bookworm"
            use_container: true
          - arch: armhf
            debian: trixie
            runner: self-hosted
            image: "arm32v7/debian:trixie"
            use_container: true

    container:
      image: ${{ matrix.image }}
      # Only use container for builds that need it
      if: matrix.use_container

    steps:
    - name: Set up environment
      run: |
        echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV

    - name: Install build dependencies
      run: |
        apt-get update && apt-get install -yq --no-install-recommends \
          build-essential \
          debhelper \
          cmake \
          git \
          ca-certificates \
          libportaudio2 \
          portaudio19-dev \
          libasound2-dev \
          libavahi-compat-libdnssd-dev \
          avahi-daemon
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Prepare debian directory
      run: |
        # Clean up any root-owned files from previous builds
        if [ -d "debian" ]; then
          rm -rf debian
        fi

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Apply disable-examples patch
      run: |
        cd sendspin-cpp
        patch -p1 < ../disable-examples.patch
        cd ..

    - name: Build Debian package
      run: |
        # Clean up all old packages before build
        rm -f ../${{ env.DEB_PACKAGE_NAME }}_*.deb
        rm -f ../${{ env.DEB_PACKAGE_NAME }}-dbgsym_*.deb

        # Build package
        dpkg-buildpackage -us -uc -b

        # Show built packages
        ls -la ../*.deb

        # Rename to include architecture and distribution
        for deb in ../${{ env.DEB_PACKAGE_NAME }}*.deb; do
          if [ -f "$deb" ]; then
            new_name="$(echo "$deb" | sed "s/.deb$/_${{ matrix.arch }}_${{ matrix.debian }}.deb/")"
            mv "$deb" "$new_name"
          fi
        done

        # Show final packages
        ls -la ../*.deb

    - name: Upload Debian package artifact
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{ matrix.arch }}-${{ matrix.debian }}
        path: |
          ${{ env.PARENT_DIR }}/sendspin-client_*_${{ matrix.arch }}_${{ matrix.debian }}.deb
          ${{ env.PARENT_DIR }}/sendspin-client-dbgsym_*_${{ matrix.arch }}_${{ matrix.debian }}.deb
        retention-days: 7

    - name: Create Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.PARENT_DIR }}/sendspin-client_*_${{ matrix.arch }}_${{ matrix.debian }}.deb
          ${{ env.PARENT_DIR }}/sendspin-client-dbgsym_*_${{ matrix.arch }}_${{ matrix.debian }}.deb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up
      run: |
        # Clean up build directories to prevent permission issues
        echo "Cleaning up build directories..."
        rm -rf obj-*-linux-gnu*
        rm -rf build
