name: Build Unified Debian Packages

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  DEB_PACKAGE_NAME: sendspin-client
  DEB_VERSION: 0.1.0

jobs:
  build-debian-packages:

    strategy:
      fail-fast: false
      matrix:
        debian:
          - bullseye
          # - bookworm
          - trixie
        arch:
          # - amd64
          - armhf
          - arm64
        include:
          - arch: "amd64"
            os: ubuntu-latest
            image_prefix: "debian:"
          - arch: "armhf"
            os: self-hosted
            image_prefix: "arm32v7/debian:"
          - arch: "arm64"
            os: self-hosted
            image_prefix: "debian:"
    runs-on: ${{ matrix.os }}
    name: deb (${{ matrix.arch }}, ${{ matrix.debian }})

    container:
      image: ${{matrix.image_prefix}}${{matrix.debian}}
    steps:
    - name: Set up environment
      run: |
        echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV

    - name: Install build dependencies
      run: |
        apt-get update && apt-get install -yq --no-install-recommends \
          build-essential \
          debhelper \
          cmake \
          git \
          ca-certificates \
          libportaudio2 \
          portaudio19-dev \
          libasound2-dev \
          libavahi-compat-libdnssd-dev \
          avahi-daemon
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Prepare debian directory
      run: |
        # Clean up any root-owned files from previous builds
        if [ -d "debian" ]; then
          rm -rf debian
        fi

    - name: Checkout
      uses: actions/checkout@v1
      with:
        submodules: recursive

    - name: Build Debian package
      run: |
        # Clean up all old packages before build
        rm -f ../${{ env.DEB_PACKAGE_NAME }}_*.deb
        rm -f ../${{ env.DEB_PACKAGE_NAME }}-dbgsym_*.deb

        # Build package
        dpkg-buildpackage -us -uc -b

        # Show built packages
        ls -la ../*.deb

        # Rename to include architecture and distribution
        for deb in ../${{ env.DEB_PACKAGE_NAME }}*.deb; do
          if [ -f "$deb" ]; then
            new_name="$(echo "$deb" | sed "s/.deb$/_${{ matrix.debian }}.deb/")"
            mv "$deb" "$new_name"
          fi
        done

        # Show final packages
        ls -la ../*.deb
        ls -la ${{ env.PARENT_DIR }}/*.deb

    - name: Upload Debian package artifact
      uses: actions/upload-artifact@v4
      with:
        name: debian-package-${{ matrix.arch }}-${{ matrix.debian }}
        path: |
          ${{ env.PARENT_DIR }}/sendspin-client_*_${{ matrix.arch }}_${{ matrix.debian }}.deb
          # ${{ env.PARENT_DIR }}/sendspin-client-dbgsym_*_${{ matrix.arch }}_${{ matrix.debian }}.deb
        retention-days: 7

    - name: Create Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.PARENT_DIR }}/sendspin-client_*_${{ matrix.arch }}_${{ matrix.debian }}.deb
          # ${{ env.PARENT_DIR }}/sendspin-client-dbgsym_*_${{ matrix.arch }}_${{ matrix.debian }}.deb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up
      run: |
        # Clean up build directories to prevent permission issues
        echo "Cleaning up build directories..."
        rm -rf obj-*-linux-gnu*
        rm -rf build
