name: Build and Upload Debian Packages

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Select architecture to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - amd64
          - armhf
          - arm64
          - armv6
  release:
    types: [published]

env:
  DEB_PACKAGE_NAME: sendspin-client

jobs:
  # --- Job 1: Build amd64 on GitHub-hosted runner ---
  build-amd64:
    name: Build amd64 (${{ matrix.os }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || github.event.inputs.arch == 'all' || github.event.inputs.arch == 'amd64' }}
    env:
      DEB_BUILD_OPTIONS: noddebs nocheck
    strategy:
      matrix:
        os: [debian:trixie, ubuntu:24.04, ubuntu:26.04]
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Set up environment
        shell: bash
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV
          DIST_NAME="${{ matrix.os }}"
          DIST_NAME=$(echo "$DIST_NAME" | sed 's/:/_/g')  # Replace : with _
          echo "DIST_NAME=${DIST_NAME}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -yq --no-install-recommends \
            build-essential \
            debhelper \
            cmake \
            git \
            ca-certificates \
            libportaudio2 \
            portaudio19-dev \
            libasound2-dev \
            libavahi-compat-libdnssd-dev \
            avahi-daemon
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build Debian package (amd64)
        run: |
          # Clean up old packages
          rm -f ../${{ env.DEB_PACKAGE_NAME }}_*.deb
          rm -f ../${{ env.DEB_PACKAGE_NAME }}-dbgsym_*.deb

          # Build
          dpkg-buildpackage -us -uc -b

          # Rename to include architecture and distribution
          for deb in ../${{ env.DEB_PACKAGE_NAME }}*.deb; do
            if [ -f "$deb" ]; then
              new_name="$(echo "$deb" | sed "s/.deb$/_${{ env.DIST_NAME }}.deb/")"
              mv "$deb" "$new_name"
            fi
          done

          # Copy to upload directory
          mkdir -p ${{ env.PARENT_DIR }}/upload
          cp ${{ env.PARENT_DIR }}/*.deb ${{ env.PARENT_DIR }}/upload/.

      - name: List uploaded files (amd64 - ${{ matrix.os }})
        run: |
          echo "Files built for ${{ matrix.os }}:"
          ls -la ${{ env.PARENT_DIR }}/upload

      - name: Upload amd64 artifacts (temporary)
        uses: actions/upload-artifact@v7
        with:
          name: amd64-${{ env.DIST_NAME }}
          path: ${{ env.PARENT_DIR }}/upload/*.deb
          retention-days: 1

  # --- Job 2: Build armhf and arm64 on the RPi4 self-hosted runner ---
  # The runner (see .github/runner) is an arm64 container on a 64-bit kernel.
  # GitHub requires a job's `container:` image to match the runner arch, so
  # each arch is built with an explicit `docker run --platform` instead. The
  # armhf leg runs natively through the kernel's COMPAT layer (no QEMU).
  build-arm:
    name: Build arm (${{ matrix.arch }})
    runs-on: [self-hosted, Linux, ARM64]
    if: ${{ github.event_name == 'release' || github.event.inputs.arch == 'all' || github.event.inputs.arch == 'armhf' || github.event.inputs.arch == 'arm64' }}
    env:
      DEB_BUILD_OPTIONS: noddebs nocheck
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event_name == 'release' && fromJson('["armhf","arm64"]')) || (github.event.inputs.arch == 'all' && fromJson('["armhf","arm64"]')) || (github.event.inputs.arch == 'armhf' && fromJson('["armhf"]')) || (github.event.inputs.arch == 'arm64' && fromJson('["arm64"]')) || fromJson('[]') }}
        os: [debian:trixie, ubuntu:26.04]

    steps:
      - name: Set up environment
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV

      - name: Prepare debian directory
        run: |
          # Clean up any root-owned files from previous builds
          if [ -d "debian" ]; then
            rm -rf debian
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build Debian package (${{ matrix.arch }})
        run: |
          # armhf builds run through the arm32v7 images. GitHub requires a
          # job's `container:` image to match the runner arch, so each leg
          # spins up its own container with --platform instead. Both run
          # natively: arm64 on the 64-bit kernel, armhf via its COMPAT layer.
          case "${{ matrix.arch }}" in
            armhf) PLATFORM="linux/arm/v7"; IMAGE="arm32v7/${{ matrix.os }}" ;;
            *)     PLATFORM="linux/arm64";   IMAGE="${{ matrix.os }}" ;;
          esac
          PARENT_DIR=$(dirname $GITHUB_WORKSPACE)
          DIST_NAME=$(echo "${{ matrix.os }}" | sed 's/:/_/g')
          echo "Building ${{ matrix.arch }} for ${PLATFORM} using ${IMAGE}"

          docker run --rm \
            --platform ${PLATFORM} \
            -v ${PARENT_DIR}:/parent \
            -v ${GITHUB_WORKSPACE}:/workspace \
            -w /workspace \
            -u 0:0 \
            -e DEB_PACKAGE_NAME=${{ env.DEB_PACKAGE_NAME }} \
            -e DEB_BUILD_OPTIONS="noddebs nocheck" \
            -e MATRIX_ARCH=${{ matrix.arch }} \
            -e DIST_NAME=${DIST_NAME} \
            ${IMAGE} \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -yq --no-install-recommends \
                build-essential \
                debhelper \
                cmake \
                git \
                ca-certificates \
                libportaudio2 \
                portaudio19-dev \
                libasound2-dev \
                libavahi-compat-libdnssd-dev \
                avahi-daemon

              dpkg-buildpackage -us -uc -b

              # dpkg-buildpackage writes the .deb to the parent of /workspace
              for deb in /*.deb; do
                if [ -f "$deb" ]; then
                  mv "$deb" "$(echo "$deb" | sed "s/\.deb$/_${DIST_NAME}.deb/")"
                fi
              done

              mkdir -p /parent/upload
              cp /*.deb /parent/upload/.
            '

      - name: Sanitize distribution name for artifact
        run: |
          DIST_NAME="${{ matrix.os }}"
          DIST_NAME=$(echo "$DIST_NAME" | sed 's/:/_/g')  # Replace : with _
          echo "DIST_NAME=${DIST_NAME}" >> $GITHUB_ENV

      - name: List uploaded files (${{ matrix.arch }})
        run: ls -la ${{ env.PARENT_DIR }}/upload

      - name: Clean up
        run: |
          # Clean up build directories to prevent permission issues
          echo "Cleaning up build directories..."
          rm -rf obj-*-linux-gnu*

  # --- Job 3: Build armv6 (Raspberry Pi OS / Raspbian) ---
  build-armv6:
    name: Build armv6 (${{ matrix.os }})
    runs-on: [self-hosted, Linux, X64]
    if: ${{ github.event_name == 'release' || github.event.inputs.arch == 'all' || github.event.inputs.arch == 'armv6' }}
    strategy:
      fail-fast: false
      matrix:
        os: [raspian:trixie]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build in Docker container
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV
          PARENT_DIR=$(dirname $GITHUB_WORKSPACE)
          UPLOAD_DIR=${PARENT_DIR}/upload
          echo "UPLOAD_DIR=${UPLOAD_DIR}" >> $GITHUB_ENV

          # Raspbian codename from the distro label (e.g. raspian:trixie -> trixie)
          CODENAME=$(echo "${{ matrix.os }}" | sed 's/raspian://')
          IMAGE="vascoguita/raspios:armhf-${CODENAME}"
          PLATFORM="linux/arm/v6"
          echo "Building for ${PLATFORM} using ${IMAGE}"

          # Run build in container with correct platform
          docker run --rm \
            --platform ${PLATFORM} \
            -v ${PARENT_DIR}:/parent \
            -v ${GITHUB_WORKSPACE}:/workspace \
            -w /workspace \
            -u 0:0 \
            -e DEB_PACKAGE_NAME=${{ env.DEB_PACKAGE_NAME }} \
            -e DEB_BUILD_OPTIONS="noddebs nocheck" \
            -e MATRIX_OS=${{ matrix.os }} \
            ${IMAGE} \
            bash -c "
              set -e

              # Install build dependencies
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -yq --no-install-recommends \
                build-essential \
                debhelper \
                cmake \
                git \
                ca-certificates \
                libportaudio2 \
                portaudio19-dev \
                libasound2-dev \
                libavahi-compat-libdnssd-dev \
                avahi-daemon \
                libatomic1

              # Set architecture for armv6
              export MATRIX_ARCH=armv6
              export DEB_HOST_ARCH=armv6

              # Build
              dpkg-buildpackage -us -uc -b

              # Rename packages (armhf -> armv6) and append distribution
              DIST_NAME=\"\$MATRIX_OS\"
              DIST_NAME=\$(echo \"\$DIST_NAME\" | sed 's/:/_/g')
              for deb in /\${DEB_PACKAGE_NAME}*.deb; do
                if [ -f \"\$deb\" ]; then
                  new_name=\$(echo \"\$deb\" | sed \"s/armhf/armv6/g\" | sed \"s/.deb$/_\${DIST_NAME}.deb/\")
                  mv \"\$deb\" \"\$new_name\"
                fi
              done

              # Clean debian directory
              if [ -d \"debian\" ]; then
                rm -rf debian
              fi
              rm -rf obj-arm-linux-*

              # Copy to upload directory
              mkdir -p /parent/upload
              cp /*.deb /parent/upload/.
            "

      - name: Sanitize distribution name for artifact
        run: |
          DIST_NAME="${{ matrix.os }}"
          DIST_NAME=$(echo "$DIST_NAME" | sed 's/:/_/g')  # Replace : with _
          echo "DIST_NAME=${DIST_NAME}" >> $GITHUB_ENV

      - name: List uploaded files (${{ matrix.os }})
        run: ls -la ${{ env.UPLOAD_DIR }}

      - name: Upload armv6 artifacts (temporary)
        uses: actions/upload-artifact@v7
        with:
          name: armv6-${{ env.DIST_NAME }}
          path: ${{ env.UPLOAD_DIR }}/*.deb
          retention-days: 1

  # --- Job 4: Combine and release on the RPi4 self-hosted runner ---
  # Runs on the same arm64 runner as build-arm, so the arm debs it produced are
  # already in PARENT_DIR/upload on the same host.
  upload-all:
    name: Upload all packages
    needs: [build-amd64, build-arm, build-armv6]
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: write
    steps:
      - name: Set up environment
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV

      - name: Download amd64 artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: amd64-*
          path: artifacts
          merge-multiple: true

      - name: Download armv6 artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: armv6-*
          path: artifacts
          merge-multiple: true

      - name: Merge all .deb files into the RPi4 local upload directory
        run: |
          # The arm build (same runner) already placed its debs in PARENT_DIR/upload
          mkdir -p ${{ env.PARENT_DIR }}/upload

          # Copy in amd64 and armv6 debs downloaded from artifacts
          find artifacts -name "*.deb" -exec cp -n {} ${{ env.PARENT_DIR }}/upload/ \;

      - name: List all collected files
        run: ls -la ${{ env.PARENT_DIR }}/upload

      - name: Create Release (if triggered by release)
        if: github.event_name == 'release'
        run: |
          # Create a temporary directory for release files (excluding debug symbols)
          mkdir -p ${{ env.PARENT_DIR }}/release-upload

          # Copy all .deb files except debug symbol packages
          find ${{ env.PARENT_DIR }}/upload -name "*.deb" ! -name "*dbgsym*" -exec cp {} ${{ env.PARENT_DIR }}/release-upload/ \;

          # List what will be uploaded to release
          echo "Files to be uploaded to release:"
          ls -la ${{ env.PARENT_DIR }}/release-upload/

      - name: Upload Release files
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PARENT_DIR }}/release-upload/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        run: |
          # Clean up build directories to prevent permission issues
          echo "Cleaning up build directories..."
          rm -rf obj-*-linux-gnu*
