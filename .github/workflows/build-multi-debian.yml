name: Build Multi-Debian Packages

on:
  workflow_dispatch:  # Allow manual triggering
  release:
    types: [published]

env:
  DEB_PACKAGE_NAME: sendspin-client
  DEB_VERSION: 0.1.0

jobs:
  build-debian-packages:
    name: Build Debian Packages
    runs-on: self-hosted  # Use Raspberry Pi self-hosted runner
    
    strategy:
      fail-fast: false
      matrix:
        debian:
          - bullseye
#          - bookworm
#          - trixie
        include:
          - debian: bullseye
#            image: "debian:bullseye"
            image: "badaix/raspios-lite:bullseye"
#          - debian: bookworm
#            image: "debian:bookworm"
#          - debian: trixie
#            image: "badaix/raspios-lite:trixie"
    
    container:
      image: ${{ matrix.image }}
    
    steps:
    - name: Install build dependencies
      run: |
        sed -i -e 's/MODULES=dep/MODULES=most/g' /etc/initramfs-tools/initramfs.conf || true
        apt-get update && apt-get install -yq \
          build-essential \
          debhelper \
          cmake \
          git \
          ca-certificates \
          libportaudio2 \
          portaudio19-dev \
          libasound2-dev \
          libavahi-compat-libdnssd-dev \
          avahi-daemon
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Prepare debian directory
      run: |
        # Clean up any root-owned files from previous builds
        if [ -d "debian" ]; then
          sudo rm -rf debian
        fi
#        mkdir -p debian/.debhelper
#        sudo chown -R $USER:$USER debian/.debhelper

    - name: Checkout
      uses: actions/checkout@v1
      with:
        submodules: recursive

    - name: Build Debian package
      run: |
        # Clean up all old packages before build - simpler approach
        rm -f ../${{ env.DEB_PACKAGE_NAME }}_*.deb
        rm -f ../${{ env.DEB_PACKAGE_NAME }}-dbgsym_*.deb
        
        fakeroot make -f debian/rules binary
        
        # Show built packages
        ls -la ../*.deb
        
        # Detect actual architecture and rename appropriately
        ACTUAL_ARCH=$(dpkg --print-architecture)
        echo "Detected architecture: $ACTUAL_ARCH"
        
        # Rename to include actual architecture and distribution
        for deb in ../${{ env.DEB_PACKAGE_NAME }}_${{ env.DEB_VERSION }}-1_*.deb; do
          if [ -f "$deb" ]; then
            new_name=$(echo "$deb" | sed "s/_${{ env.DEB_VERSION }}-1_/_${{ env.DEB_VERSION }}-1_${ACTUAL_ARCH}_${{ matrix.debian }}_/")
            mv "$deb" "$new_name"
          fi
        done
        
        ls -la ../*_armhf_${{ matrix.debian }}.deb

    - name: Upload Debian package artifact
      uses: actions/upload-artifact@v7
      with:
        name: debian-package-armhf-${{ matrix.debian }}
        path: |
          ${{ env.PARENT_DIR }}/sendspin-client_*_armhf_${{ matrix.debian }}.deb
          ${{ env.PARENT_DIR }}/sendspin-client-dbgsym_*_armhf_${{ matrix.debian }}.deb
        retention-days: 7

    - name: Create Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.PARENT_DIR }}/sendspin-client_*_armhf_${{ matrix.debian }}.deb
          ${{ env.PARENT_DIR }}/sendspin-client-dbgsym_*_armhf_${{ matrix.debian }}.deb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Show package info
      run: |
        echo "=== Built Debian Package for ${{ matrix.debian }} ==="
        ls -la ../*_armhf_${{ matrix.debian }}.deb
        echo ""
        echo "=== Package Contents ==="
        dpkg -c ../*_armhf_${{ matrix.debian }}.deb | head -20
