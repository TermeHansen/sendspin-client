name: Build and Upload Debian Packages

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Select architecture to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - amd64
          - armhf
          - arm64
          - armv6
      os:
        description: 'Select OS to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debian:bullseye
          - debian:trixie
          - ubuntu:24.04
          - ubuntu:26.04
  release:
    types: [published]

env:
  DEB_PACKAGE_NAME: sendspin-client

jobs:
  # --- Job 1: Build amd64 on GitHub-hosted runner ---
  build-amd64:
    name: Build amd64 (${{ matrix.os }})
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.arch == 'all' || github.event.inputs.arch == 'amd64' }}
    strategy:
      matrix:
        os: ${{ github.event.inputs.os == 'all' && fromJson('["debian:trixie","ubuntu:24.04","ubuntu:26.04"]') || fromJson(format('["{0}"]', github.event.inputs.os)) }}
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Set up environment
        shell: bash
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV
          DIST_NAME="${{ matrix.os }}" 
          DIST_NAME=$(echo "$DIST_NAME" | sed 's/:/_/g')  # Replace : with _
          echo "DIST_NAME=${DIST_NAME}" >> $GITHUB_ENV


      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -yq --no-install-recommends \
            build-essential \
            debhelper \
            cmake \
            git \
            ca-certificates \
            libportaudio2 \
            portaudio19-dev \
            libasound2-dev \
            libavahi-compat-libdnssd-dev \
            avahi-daemon
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Debian package (amd64)
        run: |
          # Clean up old packages
          rm -f ../${{ env.DEB_PACKAGE_NAME }}_*.deb
          rm -f ../${{ env.DEB_PACKAGE_NAME }}-dbgsym_*.deb

          # Build
          dpkg-buildpackage -us -uc -b

          # Rename to include architecture and distribution
          for deb in ../${{ env.DEB_PACKAGE_NAME }}*.deb; do
            if [ -f "$deb" ]; then
              new_name="$(echo "$deb" | sed "s/.deb$/_${{ env.DIST_NAME }}.deb/")"
              mv "$deb" "$new_name"
            fi
          done

          # Copy to upload directory
          mkdir -p ${{ env.PARENT_DIR }}/upload
          cp ${{ env.PARENT_DIR }}/*.deb ${{ env.PARENT_DIR }}/upload/.

      - name: List uploaded files (amd64 - ${{ matrix.os }})
        run: |
          echo "Files built for ${{ matrix.os }}:"
          ls -la ${{ env.PARENT_DIR }}/upload

      - name: Upload amd64 artifacts (temporary)
        uses: actions/upload-artifact@v7  # Use v3 for compatibility
        with:
          name: amd64-${{ env.DIST_NAME }}
          path: ${{ env.PARENT_DIR }}/upload/*.deb
          retention-days: 1  # Short retention since we'll re-upload later

  # --- Job 2: Build armhf, arm64, and armv6 on AMD64 runner with Docker Buildx ---
  build-arm:
    name: Build arm (${{ matrix.arch }})
    runs-on: self-hosted
    if: ${{ github.event.inputs.arch == 'all' || github.event.inputs.arch == 'armhf' || github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'armv6' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event.inputs.arch == 'all' && fromJson('["armhf","arm64","armv6"]') || fromJson(format('["{0}"]', github.event.inputs.arch)) }}
        os: ${{ github.event.inputs.os == 'all' && fromJson('["debian:bullseye","debian:trixie","ubuntu:24.04","ubuntu:26.04"]') || fromJson(format('["{0}"]', github.event.inputs.os)) }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Docker container
        run: |
          # Determine platform and image based on architecture
          case "${{ matrix.arch }}" in
            arm64)
              PLATFORM="linux/arm64"
              IMAGE="${{ matrix.os }}"
              ;;
            armv6)
              PLATFORM="linux/arm/v6"
              IMAGE="vascoguita/raspios:armhf-trixie"
              ;;
            armhf)
              PLATFORM="linux/arm/v7"
              IMAGE="arm32v7/${{ matrix.os }}"
              ;;
          esac

          echo "Building for ${PLATFORM} using ${IMAGE}"
          
          # Set up environment
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV
          
          # Run build in container with correct platform
          # Mount parent directory to access debian packaging files
          PARENT_DIR=$(dirname $GITHUB_WORKSPACE)
          docker run --rm \
            --platform ${PLATFORM} \
            -v ${PARENT_DIR}:/parent \
            -v ${GITHUB_WORKSPACE}:/workspace \
            -w /workspace \
            -u 0:0 \
            -e DEB_PACKAGE_NAME=${{ env.DEB_PACKAGE_NAME }} \
            -e MATRIX_ARCH=${{ matrix.arch }} \
            -e MATRIX_OS=${{ matrix.os }} \
            ${IMAGE} \
            bash -c "
              set -e
              
              # Install build dependencies
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -yq --no-install-recommends \
                build-essential \
                debhelper \
                cmake \
                git \
                ca-certificates \
                libportaudio2 \
                portaudio19-dev \
                libasound2-dev \
                libavahi-compat-libdnssd-dev \
                avahi-daemon \
                libatomic1
              
              # Set architecture for armv6
              if [ \"\$MATRIX_ARCH\" = 'armv6' ]; then
                export DEB_HOST_ARCH=armv6
              fi
              
              # Build
              dpkg-buildpackage -us -uc -b
              
              # Rename packages
              DIST_NAME=\"\$MATRIX_OS\"
              DIST_NAME=\$(echo \"\$DIST_NAME\" | sed 's/:/_/g')
              for deb in /parent/\${DEB_PACKAGE_NAME}*.deb; do
                if [ -f \"\$deb\" ]; then
                  if [ \"\$MATRIX_ARCH\" = 'armv6' ]; then
                    new_name=\$(echo \"\$deb\" | sed \"s/armhf/armv6/g\" | sed \"s/.deb$/_\${DIST_NAME}.deb/\")
                  else
                    new_name=\$(echo \"\$deb\" | sed \"s/.deb$/_\${DIST_NAME}.deb/\")
                  fi
                  mv \"\$deb\" \"\$new_name\"
                fi
              done
              
              # Clean debian directory
              #if [ -d \"debian\" ]; then
              #  rm -rf debian
              #fi

              # Copy to upload directory
              mkdir -p /parent/upload
              cp /*.deb /parent/upload/.
            "
          
          # Set upload directory (files are in parent/upload from container)
          echo "UPLOAD_DIR=${PARENT_DIR}/upload" >> $GITHUB_ENV

      - name: List uploaded files (${{ matrix.arch }})
        run: ls -la ${{ env.UPLOAD_DIR }}

      - name: Upload arm artifacts (temporary)
        uses: actions/upload-artifact@v7
        with:
          name: arm-${{ matrix.arch }}-${{ matrix.os }}
          path: ${{ env.UPLOAD_DIR }}/*.deb
          retention-days: 1

  # --- Job 3: Combine and upload all artifacts ---
  upload-all:
    name: Upload all packages
    needs: [build-amd64, build-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up environment
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: List all downloaded files
        run: find artifacts -name "*.deb" -exec ls -la {} \;

      - name: Move all .deb files to a single directory
        run: |
          find artifacts -name "*.deb" -exec cp {} ${{ env.PARENT_DIR }}/upload/ \;

      - name: Upload all .deb files as a single artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-debian-packages
          path: ${{ env.PARENT_DIR }}/upload/*.deb
          retention-days: 7

      - name: Create Release (if triggered by release)
        if: github.event_name == 'release'
        run: |
          # Create a temporary directory for release files (excluding debug symbols)
          mkdir -p ${{ env.PARENT_DIR }}/release-upload
          
          # Copy all .deb files except debug symbol packages
          find ${{ env.PARENT_DIR }}/upload -name "*.deb" ! -name "*dbgsym*" -exec cp {} ${{ env.PARENT_DIR }}/release-upload/ \;
          
          # List what will be uploaded to release
          echo "Files to be uploaded to release:"
          ls -la ${{ env.PARENT_DIR }}/release-upload/

      - name: Upload Release files
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PARENT_DIR }}/release-upload/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        run: |
          # Clean up build directories to prevent permission issues
          echo "Cleaning up build directories..."
          rm -rf obj-*-linux-gnu*
