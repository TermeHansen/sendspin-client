name: Build and Upload Debian Packages

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Select architecture to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - amd64
          - armhf
          - arm64
          - armv6
      os:
        description: 'Select OS to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debian:bullseye
          - debian:trixie
          - ubuntu:24.04
          - ubuntu:26.04
  release:
    types: [published]

env:
  DEB_PACKAGE_NAME: sendspin-client

jobs:
  # --- Job 0: Setup - determine which builds to run ---
  setup:
    name: Setup build matrix
    runs-on: ubuntu-latest
    outputs:
      build_amd64: ${{ steps.setup.outputs.build_amd64 }}
      build_arm: ${{ steps.setup.outputs.build_arm }}
      amd64_os_json: ${{ steps.setup.outputs.amd64_os_json }}
      arm_arch_json: ${{ steps.setup.outputs.arm_arch_json }}
      arm_os_json: ${{ steps.setup.outputs.arm_os_json }}
    steps:
      - name: Determine build matrix
        id: setup
        run: |
          # Determine which architectures to build
          SELECTED_ARCH="${{ github.event.inputs.arch || 'all' }}"
          SELECTED_OS="${{ github.event.inputs.os || 'all' }}"
          
          # Filter architectures
          if [ "$SELECTED_ARCH" = "all" ]; then
            BUILD_AMD64="true"
            BUILD_ARM="true"
          elif [ "$SELECTED_ARCH" = "amd64" ]; then
            BUILD_AMD64="true"
            BUILD_ARM="false"
          elif [ "$SELECTED_ARCH" = "armhf" ] || [ "$SELECTED_ARCH" = "arm64" ] || [ "$SELECTED_ARCH" = "armv6" ]; then
            BUILD_AMD64="false"
            BUILD_ARM="true"
          else
            BUILD_AMD64="false"
            BUILD_ARM="false"
          fi
          
          # Generate JSON arrays for matrices
          if [ "$BUILD_AMD64" = "true" ]; then
            if [ "$SELECTED_OS" = "all" ]; then
              AMD64_OS_JSON='["debian:trixie","ubuntu:24.04","ubuntu:26.04"]'
            else
              AMD64_OS_JSON="[\"${SELECTED_OS}\"]"
            fi
          else
            AMD64_OS_JSON='[]'
          fi
          
          if [ "$BUILD_ARM" = "true" ]; then
            if [ "$SELECTED_ARCH" = "all" ]; then
              ARM_ARCH_JSON='["armhf","arm64","armv6"]'
            else
              ARM_ARCH_JSON="[\"${SELECTED_ARCH}\"]"
            fi
            
            if [ "$SELECTED_OS" = "all" ]; then
              ARM_OS_JSON='["debian:bullseye","debian:trixie","ubuntu:24.04","ubuntu:26.04"]'
            else
              ARM_OS_JSON="[\"${SELECTED_OS}\"]"
            fi
          else
            ARM_ARCH_JSON='[]'
            ARM_OS_JSON='[]'
          fi
          
          echo "build_amd64=$BUILD_AMD64" >> $GITHUB_OUTPUT
          echo "build_arm=$BUILD_ARM" >> $GITHUB_OUTPUT
          echo "amd64_os_json=$AMD64_OS_JSON" >> $GITHUB_OUTPUT
          echo "arm_arch_json=$ARM_ARCH_JSON" >> $GITHUB_OUTPUT
          echo "arm_os_json=$ARM_OS_JSON" >> $GITHUB_OUTPUT

  # --- Job 1: Build amd64 on GitHub-hosted runner ---
  build-amd64:
    name: Build amd64 (${{ matrix.os }})
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ needs.setup.outputs.build_amd64 == 'true' }}
    strategy:
      matrix:
        os: ${{ fromJson(needs.setup.outputs.amd64_os_json) }}
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Set up environment
        shell: bash
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV
          DIST_NAME="${{ matrix.os }}" 
          DIST_NAME=$(echo "$DIST_NAME" | sed 's/:/_/g')  # Replace : with _
          echo "DIST_NAME=${DIST_NAME}" >> $GITHUB_ENV


      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -yq --no-install-recommends \
            build-essential \
            debhelper \
            cmake \
            git \
            ca-certificates \
            libportaudio2 \
            portaudio19-dev \
            libasound2-dev \
            libavahi-compat-libdnssd-dev \
            avahi-daemon
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Debian package (amd64)
        run: |
          # Clean up old packages
          rm -f ../${{ env.DEB_PACKAGE_NAME }}_*.deb
          rm -f ../${{ env.DEB_PACKAGE_NAME }}-dbgsym_*.deb

          # Build
          dpkg-buildpackage -us -uc -b

          # Rename to include architecture and distribution
          for deb in ../${{ env.DEB_PACKAGE_NAME }}*.deb; do
            if [ -f "$deb" ]; then
              new_name="$(echo "$deb" | sed "s/.deb$/_${{ env.DIST_NAME }}.deb/")"
              mv "$deb" "$new_name"
            fi
          done

          # Copy to upload directory
          mkdir -p ${{ env.PARENT_DIR }}/upload
          cp ${{ env.PARENT_DIR }}/*.deb ${{ env.PARENT_DIR }}/upload/.

      - name: List uploaded files (amd64 - ${{ matrix.os }})
        run: |
          echo "Files built for ${{ matrix.os }}:"
          ls -la ${{ env.PARENT_DIR }}/upload

      - name: Upload amd64 artifacts (temporary)
        uses: actions/upload-artifact@v7  # Use v3 for compatibility
        with:
          name: amd64-${{ env.DIST_NAME }}
          path: ${{ env.PARENT_DIR }}/upload/*.deb
          retention-days: 1  # Short retention since we'll re-upload later

  # --- Job 2: Build armhf, arm64, and armv6 on self-hosted runner ---
  build-arm:
    name: Build arm (${{ matrix.arch }})
    runs-on: self-hosted
    needs: setup
    if: ${{ needs.setup.outputs.build_arm == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.setup.outputs.arm_arch_json) }}
        os: ${{ fromJson(needs.setup.outputs.arm_os_json) }}
        include:
          - arch: "armhf"
            image_prefix: "arm32v7/"
          - arch: "arm64"
            image_prefix: ""
          - arch: "armv6"
            image_prefix: "arm32v7/"  # arm32v7 works for armv6 builds with proper flags
    container:
      image: ${{ matrix.image_prefix }}${{ matrix.os }}

    steps:
      - name: Set up environment
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -yq --no-install-recommends \
            build-essential \
            debhelper \
            cmake \
            git \
            ca-certificates \
            libportaudio2 \
            portaudio19-dev \
            libasound2-dev \
            libavahi-compat-libdnssd-dev \
            avahi-daemon \
            libatomic1
        env:
          DEBIAN_FRONTEND: noninteractive



      - name: Prepare debian directory
        run: |
          # Clean up any root-owned files from previous builds
          if [ -d "debian" ]; then
            rm -rf debian
          fi

      - name: Checkout
        uses: actions/checkout@v1
        with:
          submodules: recursive

      - name: Build Debian package (${{ matrix.arch }})
        run: |
          # Clean up old packages
          rm -f ../${{ env.DEB_PACKAGE_NAME }}_*.deb
          rm -f ../${{ env.DEB_PACKAGE_NAME }}-dbgsym_*.deb

          # Set architecture-specific flags for armv6
          export MATRIX_ARCH="${{ matrix.arch }}"

          # Build - toolchain file for armv6 is handled in debian/rules via MATRIX_ARCH
          dpkg-buildpackage -us -uc -b -j$(nproc) DEB_BUILD_OPTIONS="nocheck"

          # Rename to include distribution and handle armv6 architecture
          DIST_NAME="${{ matrix.os }}"
          # Replace : with _ using sed for compatibility
          DIST_NAME=$(echo "$DIST_NAME" | sed 's/:/_/g')
          for deb in ../${{ env.DEB_PACKAGE_NAME }}*.deb; do
            if [ -f "$deb" ]; then
              # For armv6, replace armhf with armv6 in the filename
              if [ "${{ matrix.arch }}" = "armv6" ]; then
                new_name="$(echo "$deb" | sed "s/armhf/armv6/g" | sed "s/.deb$/_${DIST_NAME}.deb/")"
              else
                new_name="$(echo "$deb" | sed "s/.deb$/_${DIST_NAME}.deb/")"
              fi
              mv "$deb" "$new_name"
            fi
          done

          # Copy to upload directory
          mkdir -p ${{ env.PARENT_DIR }}/upload
          cp ${{ env.PARENT_DIR }}/*.deb ${{ env.PARENT_DIR }}/upload/.

      - name: List uploaded files (${{ matrix.arch }})
        run: ls -la ${{ env.PARENT_DIR }}/upload

      # Upload ARM artifacts so Job 3 can collect them
#      - name: Upload arm artifacts (temporary)
#        uses: actions/upload-artifact@v7
#        with:
#          name: arm-${{ matrix.arch }}-${{ matrix.os }}
#          path: ${{ env.PARENT_DIR }}/upload/*.deb
#          retention-days: 1

      - name: Clean up
        run: |
          # Clean up build directories to prevent permission issues
          echo "Cleaning up build directories..."
          rm -rf obj-*-linux-gnu*

  # --- Job 3: Combine and upload all artifacts ---
  upload-all:
    name: Upload all packages
    needs: [build-amd64, build-arm]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Set up environment
        run: |
          echo "PARENT_DIR=$(dirname $GITHUB_WORKSPACE)" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: List all downloaded files
        run: find artifacts -name "*.deb" -exec ls -la {} \;

      - name: Move all .deb files to a single directory
        run: |
          find artifacts -name "*.deb" -exec cp {} ${{ env.PARENT_DIR }}/upload/ \;

      - name: Upload all .deb files as a single artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-debian-packages
          path: ${{ env.PARENT_DIR }}/upload/*.deb
          retention-days: 7

      - name: Create Release (if triggered by release)
        if: github.event_name == 'release'
        run: |
          # Create a temporary directory for release files (excluding debug symbols)
          mkdir -p ${{ env.PARENT_DIR }}/release-upload
          
          # Copy all .deb files except debug symbol packages
          find ${{ env.PARENT_DIR }}/upload -name "*.deb" ! -name "*dbgsym*" -exec cp {} ${{ env.PARENT_DIR }}/release-upload/ \;
          
          # List what will be uploaded to release
          echo "Files to be uploaded to release:"
          ls -la ${{ env.PARENT_DIR }}/release-upload/

      - name: Upload Release files
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PARENT_DIR }}/release-upload/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        run: |
          # Clean up build directories to prevent permission issues
          echo "Cleaning up build directories..."
          rm -rf obj-*-linux-gnu*
