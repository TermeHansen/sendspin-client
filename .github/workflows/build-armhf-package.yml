name: Build ARMHF Debian Package

on:
  workflow_dispatch:  # Allow manual triggering
  release:
    types: [published]

env:
  DEB_PACKAGE_NAME: sendspin-client
  DEB_VERSION: 0.1.0

jobs:
  build-armhf-package:
    name: Build ARMHF Package
    runs-on: self-hosted  # Use Raspberry Pi self-hosted runner
    
    # No container needed - building natively on Raspberry Pi
    
    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential \
          debhelper \
          devscripts \
          cmake \
          git \
          libportaudio2 \
          portaudio19-dev \
          libasound2-dev \
          libavahi-compat-libdnssd-dev \
          avahi-daemon \
          lintian
    
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Apply disable-examples patch
      run: |
        cd sendspin-cpp
        patch -p1 < ../disable-examples.patch
        cd ..
    
    - name: Build Debian package
      run: |
        # Build using native ARMHF environment
        fakeroot make -f debian/rules binary
        
        # Show built packages
        ls -la ../*.deb
        
        # Rename to include architecture and distribution
        for deb in ../${{ env.DEB_PACKAGE_NAME }}_*.deb; do
          if [ -f "$deb" ]; then
            new_name=$(echo "$deb" | sed "s/_${{ env.DEB_VERSION }}-1/_${{ env.DEB_VERSION }}-1_armhf_trixie/")
            sudo mv "$deb" "$new_name"
          fi
        done
        ls -la ../*.deb

    - name: Upload ARMHF Debian package artifact
      uses: actions/upload-artifact@v7
      with:
        name: debian-package-armhf
        path: ../*.deb
        retention-days: 7

    - name: Create ARMHF Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: ../*.deb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Show package info
      run: |
        echo "=== Built ARMHF Debian Package ==="
        ls -la ../*.deb
        echo ""
        echo "=== Package Contents ==="
        dpkg -c ../*_armhf_trixie.deb