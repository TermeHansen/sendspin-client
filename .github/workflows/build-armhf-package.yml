name: Build ARMHF Debian Package

on:
  workflow_dispatch:  # Allow manual triggering
  release:
    types: [published]

env:
  DEB_PACKAGE_NAME: sendspin-client
  DEB_VERSION: 0.1.0
  TARGET_ARCH: armhf
  TARGET_DISTRO: trixie

jobs:
  build-armhf-package:
    name: Build ARMHF Package
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          debhelper \
          devscripts \
          dh-make \
          cmake \
          libportaudio2 \
          portaudio19-dev \
          libavahi-compat-libdnssd-dev \
          git \
          patch \
          lintian \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          crossbuild-essential-armhf

    - name: Apply disable-examples patch
      run: |
        cd sendspin-cpp
        patch -p1 < ../disable-examples.patch
        cd ..

    - name: Set up cross-compilation environment
      run: |
        echo "Setting up for ARMHF cross-compilation..."
        echo "DEB_BUILD_ARCH=armhf" >> $GITHUB_ENV
        echo "DEB_HOST_ARCH=armhf" >> $GITHUB_ENV

    - name: Build ARMHF Debian package
      run: |
        # Set cross-compilation flags
        export CC=arm-linux-gnueabihf-gcc
        export CXX=arm-linux-gnueabihf-g++
        
        # Build the package
        dpkg-buildpackage -us -uc -b -aarmhf
        
        # Show built packages
        ls -la ../*.deb

    - name: Lint Debian package
      run: lintian ../*_armhf.deb || true  # Don't fail on lintian warnings

    - name: Upload ARMHF Debian package artifact
      uses: actions/upload-artifact@v3
      with:
        name: debian-package-armhf
        path: ../*_armhf.deb
        retention-days: 7

    - name: Create ARMHF Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: ../*_armhf.deb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Show package info
      run: |
        echo "=== Built ARMHF Debian Package ==="
        ls -la ../*_armhf.deb
        echo ""
        echo "=== Package Contents ==="
        dpkg -c ../*_armhf.deb